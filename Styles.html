<style>
  :root { color-scheme: light; font-family: Arial, sans-serif; color: #172033; background: #f4f7fb; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .container { width: min(100% - 32px, 760px); margin: 0 auto; padding: 48px 0; }
  .eyebrow { color: #2863c8; font-size: .78rem; font-weight: 700; letter-spacing: .08em; margin: 0 0 8px; }
  h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.5rem); }
  h2 { margin-top: 0; font-size: 1.25rem; }
  .intro { color: #526174; line-height: 1.5; }

  .table-scroll { border: 1px solid #dbe3ef; border-radius: 8px; overflow-x: auto; }

  tr:last-child td { border-bottom: 0; }
  th { background: #f6f8fb; color: #526174; font-size: .78rem; letter-spacing: .03em; text-transform: uppercase; }
  td { font-size: .92rem; }

  .conference-heading h3 { margin: 0 0 8px; font-size: 1.2rem; }
  .conference-heading p:not(.eyebrow) { color: #526174; line-height: 1.45; margin: 0; max-width: 500px; }
  .conference-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .scan-form { background: #f6f8fb; border-radius: 8px; margin-top: 20px; padding: 16px; }
  .camera-panel { background: #101828; border-radius: 10px; margin-top: 20px; overflow: hidden; position: relative; }
  .camera-panel video { display: block; max-height: 390px; object-fit: cover; width: 100%; }
  .camera-fallback-reader { min-height: 250px; }
  .camera-fallback-reader video { display: block; max-height: 390px; object-fit: cover; width: 100%; }
  .camera-frame { border: 3px solid #6ce9a6; border-radius: 8px; bottom: 18%; box-shadow: 0 0 0 200vmax #0005; left: 8%; pointer-events: none; position: absolute; right: 8%; top: 18%; }
  .camera-status { background: #101828e8; bottom: 0; color: #fff; font-size: .88rem; margin: 0; padding: 12px 16px; position: absolute; width: 100%; }

  .metric strong { display: block; font-size: 1.35rem; margin-top: 3px; }
  .status { border-radius: 14px; display: inline-block; font-size: .78rem; font-weight: 700; padding: 5px 9px; white-space: nowrap; }

  .status.complete { background: #dcfae6; color: #14733e; }
  .status.partial { background: #fff3d7; color: #925b00; }
  .status.excess { background: #fee4e2; color: #b42318; }
  .scan-success { color: #14733e; font-weight: 700; }
  .scan-error { color: #b42318; font-weight: 700; }

</style>
